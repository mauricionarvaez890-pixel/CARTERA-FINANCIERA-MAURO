<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Pedidos 24/7</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    h1 { font-size: 1.5rem; color: #38bdf8; }
    .status-bar { font-size: 0.85rem; color: #94a3b8; display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; display: inline-block; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: transform 0.2s; }
    .card:hover { transform: translateY(-2px); }
    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .client-name { font-weight: 600; font-size: 1.1rem; }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
    .badge-pendiente { background-color: #f59e0b20; color: #fbbf24; border: 1px solid #f59e0b; }
    .badge-proceso { background-color: #3b82f620; color: #60a5fa; border: 1px solid #3b82f6; }
    .badge-entregado { background-color: #22c55e20; color: #4ade80; border: 1px solid #22c55e; }
    
    .order-details { font-size: 0.95rem; color: #cbd5e1; background-color: #0f172a50; padding: 10px; border-radius: 6px; }
    .card-footer { display: flex; justify-content: space-between; font-size: 0.85rem; color: #64748b; margin-top: 5px; }

    .state-message { text-align: center; padding: 40px; color: #64748b; font-size: 1.1rem; grid-column: 1 / -1; }
    .error-msg { color: #f87171; background-color: #450a0a; padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; }
  </style> 
</head>
<body>

  <header>
    <h1>📋 Libreta de Pedidos</h1>
    <div class="status-bar">
      <span class="dot"></span>
      <span id="last-update">Sincronizando...</span>
    </div>
  </header>

  <div id="error-banner" class="error-msg"></div>
  <div id="orders-container" class="grid"></div>

  <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTyxLjfhAQe2tN0dj74gAuG9P3bSNEyn6T4VInk3dYvf-XxIyzR4SiV4MCcLyi6Qh7ujsZOWujl-j_I/pub?output=csv';

    async function fetchOrders() {
      const container = document.getElementById('orders-container');
      const errorBanner = document.getElementById('error-banner');
      
      try {
        const response = await fetch(`${SHEET_CSV_URL}&t=${Date.now()}`); // cache-buster
        if (!response.ok) throw new Error("No se pudo conectar a Google Sheets");
        
        const csvText = await response.text();
        const orders = parseCSV(csvText);
        
        errorBanner.style.display = 'none';
        renderOrders(orders);
        
        document.getElementById('last-update').innerText = `Actualizado: ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        console.error("Error al cargar pedidos:", error);
        errorBanner.innerText = "⚠️ Error de conexión al cargar pedidos. Reintentando...";
        errorBanner.style.display = 'block';
      }
    }

    // Parser sencillo de CSV a Objetos JavaScript
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length <= 1) return [];
      
      const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toLowerCase());
      
      return lines.slice(1).map(line => {
        const values = line.split(',').map(v => v.trim().replace(/^"|"$/g, ''));
        let row = {};
        headers.forEach((header, index) => {
          row[header] = values[index] || '';
        });
        return row;
      });
    }

    // Renderizar tarjetas en la pantalla
    function renderOrders(orders) {
      const container = document.getElementById('orders-container');
      container.innerHTML = '';

      if (orders.length === 0) {
        container.innerHTML = '<div class="state-message">No hay pedidos registrados en la hoja de cálculo.</div>';
        return;
      }

      orders.forEach(order => {
        const estadoClean = (order.estado || 'pendiente').toLowerCase();
        let badgeClass = 'badge-pendiente';
        if (estadoClean.includes('proceso')) badgeClass = 'badge-proceso';
        if (estadoClean.includes('entregado')) badgeClass = 'badge-entregado';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span class="client-name">${order.cliente || 'Cliente Anónimo'}</span>
            <span class="badge ${badgeClass}">${order.estado || 'Pendiente'}</span>
          </div>
          <div class="order-details">
            ${order.pedido || 'Sin detalles de producto'}
          </div>
          <div class="card-footer">
            <span>ID: #${order.id || '0'}</span>
            <span>${order.fecha || ''}</span>
            <strong>${order.total || ''}</strong>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Cargar al inicio y refrescar cada 10 segundos
    fetchOrders();
    setInterval(fetchOrders, 10000);
  </script>
</body>
</html>
