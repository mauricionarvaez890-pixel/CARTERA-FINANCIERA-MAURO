<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de encargo - Dashboard 24/7</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0b1329; color: #f8fafc; padding: 20px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #1e293b; padding-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 1.6rem; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
    .status-bar { font-size: 0.85rem; color: #94a3b8; display: flex; align-items: center; gap: 8px; background: #1e293b; padding: 6px 12px; border-radius: 20px; }
    .dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #22c55e; }

    /* Seccion de Filtros */
    .filter-container { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; background-color: #131f37; padding: 12px 16px; border-radius: 12px; border: 1px solid #1e293b; }
    .filter-label { font-size: 0.9rem; font-weight: 600; color: #94a3b8; display: flex; align-items: center; gap: 6px; }
    .filter-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { background-color: #0b1329; color: #cbd5e1; border: 1px solid #334155; padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .filter-btn:hover { border-color: #38bdf8; color: #ffffff; }
    .filter-btn.active { background-color: #38bdf8; color: #0b1329; border-color: #38bdf8; font-weight: 800; }
    
    /* Colores especificos para filtros activos */
    .filter-btn.btn-pendiente.active { background-color: #ef4444; color: #ffffff; border-color: #ef4444; }
    .filter-btn.btn-aprobado.active { background-color: #22c55e; color: #ffffff; border-color: #22c55e; }
    .filter-btn.btn-proceso.active { background-color: #f59e0b; color: #ffffff; border-color: #f59e0b; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
    
    /* Tarjetas de Pedidos */
    .card { background-color: #131f37; border: 1px solid #1e293b; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; transition: all 0.2s ease-in-out; cursor: pointer; position: relative; }
    .card:hover { transform: translateY(-3px); border-color: #38bdf850; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .client-name { font-weight: 700; font-size: 1.15rem; color: #ffffff; letter-spacing: 0.3px; display: flex; align-items: center; gap: 6px; }
    
    /* Badges / Estados con Colores Solicitados */
    .badge { padding: 5px 10px; border-radius: 6px; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* 🔴 Rojo - Pendiente */
    .badge-pendiente { background-color: #ef444420; color: #f87171; border: 1px solid #ef4444; }
    /* 🟢 Verde - Aprobado */
    .badge-aprobado { background-color: #22c55e20; color: #4ade80; border: 1px solid #22c55e; }
    /* 🟠 Naranja - Saliendo / En Proceso */
    .badge-proceso { background-color: #f59e0b20; color: #fbbf24; border: 1px solid #f59e0b; }
    /* ⚪ Neutro - Otros */
    .badge-neutro { background-color: #64748b20; color: #cbd5e1; border: 1px solid #64748b; }
    
    .order-details { font-size: 0.95rem; color: #cbd5e1; background-color: #0b1329a0; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; font-weight: 500; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #64748b; margin-top: 4px; }
    .price-tag { font-size: 1rem; font-weight: 700; color: #38bdf8; }

    .state-message { text-align: center; padding: 50px; color: #64748b; font-size: 1.1rem; grid-column: 1 / -1; }
    .error-msg { color: #f87171; background-color: #450a0a; padding: 14px; border-radius: 8px; margin-bottom: 20px; display: none; border: 1px solid #ef4444; font-size: 0.95rem; line-height: 1.4; }

    /* Modal de Detalles */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-card { background: #131f37; border: 1px solid #38bdf880; border-radius: 16px; width: 90%; max-width: 450px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
    .modal-title { font-size: 1.3rem; color: #38bdf8; font-weight: bold; }
    .close-btn { background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; line-height: 1; }
    .close-btn:hover { color: #ffffff; }
    .modal-body p { margin-bottom: 10px; font-size: 0.95rem; color: #cbd5e1; }
    .modal-body strong { color: #ffffff; }
  </style>
</head>
<body>

  <header>
    <h1>📝 Ficha de encargo</h1>
    <div class="status-bar">
      <span class="dot"></span>
      <span id="last-update">Sincronizando...</span>
    </div>
  </header>

  <!-- Filtro por Estado -->
  <div class="filter-container">
    <span class="filter-label">⚙️ Filtros:</span>
    <div class="filter-buttons">
      <button class="filter-btn active" id="btn-TODOS" onclick="setFilter('TODOS')">Todos</button>
      <button class="filter-btn btn-pendiente" id="btn-PENDIENTE" onclick="setFilter('PENDIENTE')">🔴 Pendientes</button>
      <button class="filter-btn btn-aprobado" id="btn-APROBADO" onclick="setFilter('APROBADO')">🟢 Aprobados</button>
      <button class="filter-btn btn-proceso" id="btn-PROCESO" onclick="setFilter('PROCESO')">🟠 Saliendo / Despachado</button>
    </div>
  </div>

  <div id="error-banner" class="error-msg"></div>
  <div id="orders-container" class="grid"></div>

  <!-- Modal de Detalles -->
  <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span class="modal-title">Detalle del Encargo</span>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-content"></div>
    </div>
  </div>

  <script>
    // Enlace de Google Sheets convertido correctamente a output=csv
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTyxLjfhAQe2tN0dj74gAuG9P3bSNEyn6T4VInk3dYvf-XxIyzR4SiV4MCcLyi6Qh7ujsZOWujl-j_I/pub?output=csv';

    let rawOrders = [];
    let currentFilter = 'TODOS';
    let currentHTMLCache = "";

    async function fetchOrders() {
      const errorBanner = document.getElementById('error-banner');
      
      try {
        if (!SHEET_CSV_URL || SHEET_CSV_URL.includes('TU_ENLACE')) {
          throw new Error("La URL de Google Sheets no está configurada correctamente.");
        }

        const urlFinal = SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + `t=${Date.now()}`;
        const response = await fetch(urlFinal);
        
        if (!response.ok) {
          throw new Error(`Google Sheets bloqueó la conexión (Error HTTP ${response.status}). Verifica la publicación web.`);
        }
        
        const csvText = await response.text();
        
        if (csvText.trim().startsWith('<!DOCTYPE') || csvText.trim().startsWith('<html')) {
          throw new Error("Google requiere iniciar sesión. En tu hoja ve a Archivo > Compartir > Publicar en la web y desmarca 'Exigir inicio de sesión'.");
        }

        rawOrders = parseCSV(csvText);
        errorBanner.style.display = 'none';
        
        renderOrders();
        document.getElementById('last-update').innerText = `Actualizado: ${new Date().toLocaleTimeString('es-CO')}`;
      } catch (error) {
        console.error("Error al cargar pedidos:", error);
        errorBanner.innerText = `⚠️ ${error.message}`;
        errorBanner.style.display = 'block';
      }
    }

    // Parser CSV tolerante a comas en precios
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length <= 1) return [];

      const parseLine = (line) => {
        const values = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            values.push(current.trim());
            current = '';
          } else {
            current += char;
          }
        }
        values.push(current.trim());
        return values.map(v => v.replace(/^"|"$/g, '').trim());
      };

      const headers = parseLine(lines[0]).map(h => h.toLowerCase());

      return lines.slice(1).map(line => {
        if (!line.trim()) return null;
        const values = parseLine(line);
        let row = {};
        headers.forEach((header, index) => {
          row[header] = values[index] || '';
        });
        return row;
      }).filter(Boolean);
    }

    // Formatear precio a Pesos Colombianos (COP)
    function formatCOP(val) {
      if (!val) return '$0 COP';
      const cleanNum = parseInt(val.replace(/[^0-9]/g, ''), 10);
      if (isNaN(cleanNum)) return val;
      return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(cleanNum);
    }

    // Filtros por Estado
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${filter}`);
      if (activeBtn) activeBtn.classList.add('active');
      renderOrders();
    }

    // Renderizado de tarjetas con filtro activo y emoji de persona
    function renderOrders() {
      const container = document.getElementById('orders-container');

      const filteredOrders = rawOrders.filter(order => {
        const est = (order.estado || 'pendiente').toLowerCase();
        if (currentFilter === 'PENDIENTE') return est.includes('pendiente');
        if (currentFilter === 'APROBADO') return est.includes('aprobado') || est.includes('confirmado');
        if (currentFilter === 'PROCESO') return est.includes('proceso') || est.includes('saliendo') || est.includes('despachado');
        return true;
      });

      if (filteredOrders.length === 0) {
        container.innerHTML = `<div class="state-message">No hay encargo en estado "${currentFilter}" en este momento.</div>`;
        currentHTMLCache = "";
        return;
      }

      let newHTML = '';

      filteredOrders.forEach((order) => {
        const estadoClean = (order.estado || 'pendiente').toLowerCase();
        
        let badgeClass = 'badge-neutro';
        if (estadoClean.includes('pendiente')) badgeClass = 'badge-pendiente';
        else if (estadoClean.includes('aprobado') || estadoClean.includes('confirmado')) badgeClass = 'badge-aprobado';
        else if (estadoClean.includes('proceso') || estadoClean.includes('saliendo') || estadoClean.includes('despachado')) badgeClass = 'badge-proceso';

        const precioCOP = formatCOP(order.total);

        newHTML += `
          <div class="card" onclick="openModal('${encodeURIComponent(JSON.stringify(order))}')">
            <div class="card-header">
              <span class="client-name">👤 ${order.cliente || 'Cliente Anónimo'}</span>
              <span class="badge ${badgeClass}">${order.estado || 'PENDIENTE'}</span>
            </div>
            <div class="order-details">
              ${order.pedido || 'Sin detalles de producto'}
            </div>
            <div class="card-footer">
              <span>ID: #${order.id || '0'} | ${order.fecha || ''}</span>
              <span class="price-tag">${precioCOP}</span>
            </div>
          </div>
        `;
      });

      if (currentHTMLCache !== newHTML) {
        currentHTMLCache = newHTML;
        container.innerHTML = newHTML;
      }
    }

    // Modal de Detalles
    function openModal(jsonEncodedOrder) {
      const order = JSON.parse(decodeURIComponent(jsonEncodedOrder));
      const modalContent = document.getElementById('modal-content');
      
      modalContent.innerHTML = `
        <p><strong>N° de ID:</strong> #${order.id || 'N/A'}</p>
        <p><strong>Hora/Fecha:</strong> ${order.fecha || 'N/A'}</p>
        <p><strong>Cliente:</strong> 👤 ${order.cliente || 'Anónimo'}</p>
        <p><strong>Pedido:</strong> ${order.pedido || 'N/A'}</p>
        <p><strong>Valor Total:</strong> <span style="color:#38bdf8; font-weight:bold;">${formatCOP(order.total)}</span></p>
        <p><strong>Estado Actual:</strong> <span style="text-transform:uppercase; font-weight:bold;">${order.estado || 'PENDIENTE'}</span></p>
      `;

      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    // Inicio y auto-sincronización cada 10s
    fetchOrders();
    setInterval(fetchOrders, 10000);
  </script>
</body>
</html>
